<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="transitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4B5563;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background sky -->
  <rect width="600" height="200" fill="#87CEEB"/>
  
  <!-- Road -->
  <rect y="200" width="600" height="100" fill="url(#roadGrad)"/>
  
  <!-- Road lines -->
  <rect x="0" y="245" width="100" height="10" fill="white"/>
  <rect x="150" y="245" width="100" height="10" fill="white"/>
  <rect x="300" y="245" width="100" height="10" fill="white"/>
  <rect x="450" y="245" width="100" height="10" fill="white"/>
  
  <!-- Bus -->
  <rect x="100" y="170" width="120" height="60" fill="url(#transitGrad)" rx="8"/>
  <rect x="110" y="180" width="20" height="25" fill="#60A5FA"/>
  <rect x="140" y="180" width="20" height="25" fill="#60A5FA"/>
  <rect x="170" y="180" width="20" height="25" fill="#60A5FA"/>
  <rect x="200" y="180" width="20" height="25" fill="#60A5FA"/>
  
  <!-- Bus wheels -->
  <circle cx="125" cy="240" r="15" fill="#1F2937"/>
  <circle cx="195" cy="240" r="15" fill="#1F2937"/>
  <circle cx="125" cy="240" r="8" fill="#6B7280"/>
  <circle cx="195" cy="240" r="8" fill="#6B7280"/>
  
  <!-- Metro train -->
  <rect x="350" y="160" width="150" height="50" fill="#1E40AF" rx="6"/>
  <rect x="360" y="170" width="25" height="20" fill="#93C5FD"/>
  <rect x="395" y="170" width="25" height="20" fill="#93C5FD"/>
  <rect x="430" y="170" width="25" height="20" fill="#93C5FD"/>
  <rect x="465" y="170" width="25" height="20" fill="#93C5FD"/>
  
  <!-- Metro wheels -->
  <circle cx="370" cy="220" r="12" fill="#1F2937"/>
  <circle cx="410" cy="220" r="12" fill="#1F2937"/>
  <circle cx="450" cy="220" r="12" fill="#1F2937"/>
  <circle cx="480" cy="220" r="12" fill="#1F2937"/>
  
  <!-- Traffic signs -->
  <rect x="50" y="100" width="40" height="80" fill="#1F2937"/>
  <circle cx="70" cy="120" r="20" fill="#EF4444"/>
  <text x="70" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">🚌</text>
  
  <rect x="520" y="100" width="40" height="80" fill="#1F2937"/>
  <rect x="530" y="110" width="20" height="20" fill="#1E40AF"/>
  <text x="540" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">M</text>
  
  <!-- Buildings in background -->
  <rect x="20" y="120" width="20" height="80" fill="#6B7280" opacity="0.7"/>
  <rect x="280" y="110" width="25" height="90" fill="#6B7280" opacity="0.7"/>
  <rect x="580" y="130" width="20" height="70" fill="#6B7280" opacity="0.7"/>
  
  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1F2937">Transporte Público</text>
  <text x="300" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4B5563">Guia Completo São Paulo</text>
</svg>