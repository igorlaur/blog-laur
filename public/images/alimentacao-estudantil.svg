<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F3F4F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgFood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF3C7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FCD34D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="300" fill="url(#bgFood)"/>
  
  <!-- Table -->
  <ellipse cx="300" cy="200" rx="250" ry="80" fill="#92400E"/>
  
  <!-- Plates -->
  <ellipse cx="200" cy="180" rx="60" ry="40" fill="url(#plateGrad)" stroke="#E5E7EB" stroke-width="2"/>
  <ellipse cx="400" cy="180" rx="60" ry="40" fill="url(#plateGrad)" stroke="#E5E7EB" stroke-width="2"/>
  
  <!-- Food items -->
  <!-- Rice -->
  <ellipse cx="180" cy="175" rx="20" ry="15" fill="#F9FAFB"/>
  
  <!-- Beans -->
  <ellipse cx="220" cy="175" rx="15" ry="12" fill="#92400E"/>
  
  <!-- Meat -->
  <ellipse cx="200" cy="190" rx="25" ry="18" fill="#B45309"/>
  
  <!-- Salad -->
  <ellipse cx="380" cy="175" rx="22" ry="16" fill="#22C55E"/>
  
  <!-- Vegetables -->
  <ellipse cx="420" cy="175" rx="18" ry="14" fill="#F97316"/>
  
  <!-- Bread -->
  <ellipse cx="400" cy="190" rx="30" ry="20" fill="#FBBF24"/>
  
  <!-- Cutlery -->
  <rect x="150" y="160" width="3" height="40" fill="#6B7280"/>
  <rect x="160" y="160" width="3" height="40" fill="#6B7280"/>
  <ellipse cx="162" cy="155" rx="4" ry="8" fill="#6B7280"/>
  
  <rect x="450" y="160" width="3" height="40" fill="#6B7280"/>
  <rect x="460" y="160" width="3" height="40" fill="#6B7280"/>
  <ellipse cx="462" cy="155" rx="4" ry="8" fill="#6B7280"/>
  
  <!-- Steam lines -->
  <path d="M190 150 Q192 140 190 130" stroke="#E5E7EB" stroke-width="2" fill="none"/>
  <path d="M210 150 Q212 140 210 130" stroke="#E5E7EB" stroke-width="2" fill="none"/>
  <path d="M390 150 Q392 140 390 130" stroke="#E5E7EB" stroke-width="2" fill="none"/>
  <path d="M410 150 Q412 140 410 130" stroke="#E5E7EB" stroke-width="2" fill="none"/>
  
  <!-- Title -->
  <text x="300" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#92400E">Alimentação Estudantil</text>
  <text x="300" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#B45309">Opções Econômicas e Nutritivas</text>
</svg>