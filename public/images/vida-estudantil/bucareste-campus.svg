<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="businessGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingBusiness" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F9FAFB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E5E7EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#businessGrad)"/>
  
  <!-- Modern Building -->
  <rect x="200" y="100" width="400" height="250" fill="url(#buildingBusiness)" stroke="#047857" stroke-width="3"/>
  
  <!-- Glass Panels -->
  <rect x="220" y="120" width="80" height="200" fill="#3B82F6" opacity="0.7"/>
  <rect x="320" y="120" width="80" height="200" fill="#3B82F6" opacity="0.7"/>
  <rect x="420" y="120" width="80" height="200" fill="#3B82F6" opacity="0.7"/>
  <rect x="520" y="120" width="80" height="200" fill="#3B82F6" opacity="0.7"/>
  
  <!-- Modern Details -->
  <rect x="180" y="320" width="440" height="30" fill="#047857"/>
  
  <!-- Logo Area -->
  <rect x="350" y="140" width="100" height="60" fill="#047857"/>
  <text x="400" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">BUCARESTE</text>
  <text x="400" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Business School</text>
  
  <!-- Title -->
  <text x="400" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white">Bucareste</text>
  <text x="400" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="white">Escola de Negócios</text>
  
  <!-- Business Icons -->
  <circle cx="150" cy="200" r="25" fill="#F59E0B"/>
  <text x="150" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="white">$</text>
  
  <circle cx="650" cy="200" r="25" fill="#F59E0B"/>
  <text x="650" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="white">₿</text>
  
  <!-- Steps -->
  <rect x="280" y="280" width="80" height="20" fill="#047857"/>
  <rect x="300" y="300" width="80" height="20" fill="#047857"/>
  <rect x="320" y="320" width="80" height="20" fill="#047857"/>
  <rect x="340" y="340" width="80" height="10" fill="#047857"/>
  
  <rect x="440" y="280" width="80" height="20" fill="#047857"/>
  <rect x="420" y="300" width="80" height="20" fill="#047857"/>
  <rect x="400" y="320" width="80" height="20" fill="#047857"/>
  <rect x="380" y="340" width="80" height="10" fill="#047857"/>
</svg>