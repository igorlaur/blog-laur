<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F3F4F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E5E7EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#backgroundGrad)"/>
  
  <!-- Main Building -->
  <rect x="300" y="150" width="200" height="200" fill="url(#buildingGrad)" stroke="#374151" stroke-width="3"/>
  
  <!-- Windows -->
  <rect x="320" y="170" width="25" height="35" fill="#60A5FA"/>
  <rect x="355" y="170" width="25" height="35" fill="#60A5FA"/>
  <rect x="390" y="170" width="25" height="35" fill="#60A5FA"/>
  <rect x="425" y="170" width="25" height="35" fill="#60A5FA"/>
  <rect x="460" y="170" width="25" height="35" fill="#60A5FA"/>
  
  <rect x="320" y="220" width="25" height="35" fill="#60A5FA"/>
  <rect x="355" y="220" width="25" height="35" fill="#60A5FA"/>
  <rect x="390" y="220" width="25" height="35" fill="#60A5FA"/>
  <rect x="425" y="220" width="25" height="35" fill="#60A5FA"/>
  <rect x="460" y="220" width="25" height="35" fill="#60A5FA"/>
  
  <!-- Entrance -->
  <rect x="385" y="290" width="30" height="60" fill="#374151"/>
  
  <!-- Side Buildings -->
  <rect x="150" y="200" width="120" height="150" fill="url(#buildingGrad)" stroke="#374151" stroke-width="2"/>
  <rect x="530" y="200" width="120" height="150" fill="url(#buildingGrad)" stroke="#374151" stroke-width="2"/>
  
  <!-- Side Building Windows -->
  <rect x="165" y="220" width="20" height="25" fill="#60A5FA"/>
  <rect x="195" y="220" width="20" height="25" fill="#60A5FA"/>
  <rect x="225" y="220" width="20" height="25" fill="#60A5FA"/>
  
  <rect x="545" y="220" width="20" height="25" fill="#60A5FA"/>
  <rect x="575" y="220" width="20" height="25" fill="#60A5FA"/>
  <rect x="605" y="220" width="20" height="25" fill="#60A5FA"/>
  
  <!-- São Judas Logo/Text -->
  <circle cx="400" y="120" r="40" fill="#DC2626" stroke="#FFFFFF" stroke-width="3"/>
  <text x="400" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">SJ</text>
  
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white">São Judas Tadeu</text>
  <text x="400" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="white">Campus Butantã</text>
</svg>