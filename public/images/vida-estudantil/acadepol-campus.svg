<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="policeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingPoliceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6B7280;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4B5563;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#policeGrad)"/>
  
  <!-- Main Academy Building -->
  <rect x="250" y="120" width="300" height="220" fill="url(#buildingPoliceGrad)" stroke="#F59E0B" stroke-width="4"/>
  
  <!-- Entrance columns -->
  <rect x="280" y="200" width="20" height="140" fill="#F3F4F6"/>
  <rect x="320" y="200" width="20" height="140" fill="#F3F4F6"/>
  <rect x="460" y="200" width="20" height="140" fill="#F3F4F6"/>
  <rect x="500" y="200" width="20" height="140" fill="#F3F4F6"/>
  
  <!-- Windows -->
  <rect x="270" y="140" width="30" height="40" fill="#FDE047"/>
  <rect x="320" y="140" width="30" height="40" fill="#FDE047"/>
  <rect x="370" y="140" width="30" height="40" fill="#FDE047"/>
  <rect x="420" y="140" width="30" height="40" fill="#FDE047"/>
  <rect x="470" y="140" width="30" height="40" fill="#FDE047"/>
  <rect x="520" y="140" width="30" height="40" fill="#FDE047"/>
  
  <!-- Badge/Shield -->
  <path d="M400 60 L420 80 L400 100 L380 80 Z" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="400" cy="80" r="8" fill="#1F2937"/>
  
  <!-- Text -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#F59E0B">ACADEPOL</text>
  <text x="400" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#F3F4F6">Academia de Polícia Civil</text>
  
  <!-- Side Elements -->
  <rect x="80" y="250" width="100" height="90" fill="url(#buildingPoliceGrad)"/>
  <rect x="620" y="250" width="100" height="90" fill="url(#buildingPoliceGrad)"/>
  
  <!-- Training Ground Lines -->
  <line x1="100" y1="360" x2="700" y2="360" stroke="#F59E0B" stroke-width="2"/>
  <line x1="150" y1="360" x2="150" y2="370" stroke="#F59E0B" stroke-width="2"/>
  <line x1="300" y1="360" x2="300" y2="370" stroke="#F59E0B" stroke-width="2"/>
  <line x1="500" y1="360" x2="500" y2="370" stroke="#F59E0B" stroke-width="2"/>
  <line x1="650" y1="360" x2="650" y2="370" stroke="#F59E0B" stroke-width="2"/>
</svg>