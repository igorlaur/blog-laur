  <!-- USP Branding -->
  <rect x="300" y="60" width="200" height="40" fill="rgba(255,255,255,0.1)" rx="20" backdrop-filter="blur(10px)"/>
  <text x="400" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">UNIVERSIDADE DE SÃO PAULO</text>
  
