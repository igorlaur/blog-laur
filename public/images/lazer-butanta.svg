<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lazerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1B4B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#312E81;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Night sky background -->
  <rect width="600" height="300" fill="url(#nightSky)"/>
  
  <!-- Stars -->
  <circle cx="100" cy="50" r="2" fill="#FBBF24"/>
  <circle cx="200" cy="30" r="1.5" fill="#FBBF24"/>
  <circle cx="350" cy="40" r="2" fill="#FBBF24"/>
  <circle cx="450" cy="25" r="1" fill="#FBBF24"/>
  <circle cx="550" cy="60" r="1.5" fill="#FBBF24"/>
  
  <!-- Bar/Club building -->
  <rect x="150" y="150" width="300" height="120" fill="url(#lazerGrad)" rx="8"/>
  
  <!-- Neon sign effect -->
  <rect x="170" y="170" width="260" height="40" fill="none" stroke="#FBBF24" stroke-width="3" rx="5"/>
  <text x="300" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FBBF24">LAZER BUTANTÃ</text>
  
  <!-- Windows with lights -->
  <rect x="180" y="220" width="30" height="25" fill="#F59E0B"/>
  <rect x="230" y="220" width="30" height="25" fill="#EC4899"/>
  <rect x="280" y="220" width="30" height="25" fill="#8B5CF6"/>
  <rect x="330" y="220" width="30" height="25" fill="#3B82F6"/>
  <rect x="380" y="220" width="30" height="25" fill="#10B981"/>
  
  <!-- Entrance -->
  <rect x="275" y="245" width="50" height="25" fill="#1F2937"/>
  
  <!-- People silhouettes -->
  <circle cx="120" cy="260" r="8" fill="#F8FAFC"/>
  <rect x="115" y="265" width="10" height="20" fill="#F8FAFC"/>
  
  <circle cx="480" cy="255" r="8" fill="#F8FAFC"/>
  <rect x="475" y="260" width="10" height="25" fill="#F8FAFC"/>
  
  <circle cx="520" cy="265" r="6" fill="#F8FAFC"/>
  <rect x="517" y="270" width="6" height="15" fill="#F8FAFC"/>
  
  <!-- Park area -->
  <circle cx="80" cy="220" r="30" fill="#22C55E" opacity="0.8"/>
  <circle cx="70" cy="210" r="20" fill="#16A34A" opacity="0.8"/>
  <circle cx="90" cy="200" r="25" fill="#15803D" opacity="0.8"/>
  
  <circle cx="520" cy="200" r="35" fill="#22C55E" opacity="0.8"/>
  <circle cx="540" cy="190" r="25" fill="#16A34A" opacity="0.8"/>
  <circle cx="510" cy="180" r="20" fill="#15803D" opacity="0.8"/>
  
  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FBBF24">Lazer no Butantã</text>
  <text x="300" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#E5E7EB">Bares, Baladas e Parques</text>
  
  <!-- Light beams from building -->
  <path d="M200 150 L180 100 L220 100 Z" fill="#F59E0B" opacity="0.3"/>
  <path d="M300 150 L280 90 L320 90 Z" fill="#EC4899" opacity="0.3"/>
  <path d="M400 150 L380 100 L420 100 Z" fill="#8B5CF6" opacity="0.3"/>
</svg>