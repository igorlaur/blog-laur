  <rect x="56" y="91" width="12" height="23" fill="#84CC16" rx="1"/>
  <rect x="70" y="92" width="14" height="22" fill="#F59E0B" rx="1"/>
  <rect x="86" y="90" width="10" height="24" fill="#EC4899" rx="1"/>
  <rect x="98" y="91" width="12" height="23" fill="#3B82F6" rx="1"/>
  <!-- Books row 3 -->
  <rect x="28" y="140" width="10" height="24" fill="#10B981" rx="1"/>
  <rect x="40" y="142" width="14" height="22" fill="#8B5CF6" rx="1"/>
  <rect x="56" y="140" width="12" height="24" fill="#EF4444" rx="1"/>
  <rect x="70" y="141" width="10" height="23" fill="#F97316" rx="1"/>
  <rect x="82" y="140" width="14" height="24" fill="#06B6D4" rx="1"/>
  <rect x="98" y="143" width="10" height="21" fill="#F59E0B" rx="1"/>
  <!-- Books row 4 -->
  <rect x="28" y="190" width="12" height="24" fill="#EC4899" rx="1"/>
  <rect x="42" y="192" width="10" height="22" fill="#3B82F6" rx="1"/>
  <rect x="54" y="190" width="14" height="24" fill="#84CC16" rx="1"/>
  <rect x="70" y="191" width="10" height="23" fill="#EF4444" rx="1"/>
  <rect x="82" y="190" width="12" height="24" fill="#6366F1" rx="1"/>
  <rect x="96" y="192" width="12" height="22" fill="#F59E0B" rx="1"/>

  <!-- Bookshelf shelves - right -->
  <rect x="465" y="65" width="110" height="5" fill="#334155" rx="1"/>
  <rect x="465" y="115" width="110" height="5" fill="#334155" rx="1"/>
  <rect x="465" y="165" width="110" height="5" fill="#334155" rx="1"/>
  <rect x="465" y="215" width="110" height="5" fill="#334155" rx="1"/>
  <!-- Books right row 1 -->
  <rect x="468" y="40" width="12" height="24" fill="#3B82F6" rx="1"/>
  <rect x="482" y="43" width="14" height="21" fill="#10B981" rx="1"/>
  <rect x="498" y="41" width="10" height="23" fill="#EF4444" rx="1"/>
  <rect x="510" y="44" width="14" height="20" fill="#8B5CF6" rx="1"/>
  <rect x="526" y="40" width="10" height="24" fill="#F59E0B" rx="1"/>
  <rect x="538" y="42" width="12" height="22" fill="#EC4899" rx="1"/>
  <rect x="552" y="41" width="10" height="23" fill="#06B6D4" rx="1"/>
  <!-- Books right row 2 -->
  <rect x="468" y="90" width="14" height="24" fill="#F97316" rx="1"/>
  <rect x="484" y="92" width="10" height="22" fill="#6366F1" rx="1"/>
  <rect x="496" y="90" width="12" height="24" fill="#EF4444" rx="1"/>
  <rect x="510" y="91" width="10" height="23" fill="#84CC16" rx="1"/>
  <rect x="522" y="90" width="14" height="24" fill="#3B82F6" rx="1"/>
  <rect x="538" y="93" width="10" height="21" fill="#F59E0B" rx="1"/>

  <!-- Desk -->
  <rect x="160" y="200" width="280" height="18" fill="url(#deskGrad)" rx="3"/>
  <rect x="170" y="218" width="20" height="50" fill="#451A03" rx="2"/>
  <rect x="410" y="218" width="20" height="50" fill="#451A03" rx="2"/>

  <!-- Light glow on desk -->
  <ellipse cx="300" cy="200" rx="130" ry="50" fill="url(#lightSpot)"/>

  <!-- Laptop -->
  <rect x="240" y="162" width="120" height="75" fill="#334155" rx="5"/>
  <rect x="244" y="166" width="112" height="67" fill="#1E3A5F" rx="3"/>
  <!-- Screen content -->
  <rect x="249" y="170" width="102" height="10" fill="#60A5FA" rx="1" opacity="0.7"/>
  <rect x="249" y="184" width="70" height="5" fill="#94A3B8" rx="1" opacity="0.5"/>
  <rect x="249" y="193" width="85" height="5" fill="#94A3B8" rx="1" opacity="0.5"/>
  <rect x="249" y="202" width="65" height="5" fill="#94A3B8" rx="1" opacity="0.5"/>
  <rect x="249" y="211" width="80" height="5" fill="#94A3B8" rx="1" opacity="0.5"/>
  <rect x="249" y="220" width="45" height="5" fill="#94A3B8" rx="1" opacity="0.5"/>
