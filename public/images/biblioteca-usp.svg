<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="libBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#78350F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#451A03;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF08A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FCD34D;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lightSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FEF08A;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#FEF08A;stop-opacity:0" />
    </radialGradient>
    <filter id="bookShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background - library wall -->
  <rect width="600" height="300" fill="url(#libBg)"/>

  <!-- Bookshelf back wall -->
  <rect x="20" y="40" width="120" height="185" fill="#1E293B" rx="3"/>
  <rect x="460" y="40" width="120" height="185" fill="#1E293B" rx="3"/>

  <!-- Bookshelf shelves - left -->
  <rect x="25" y="65" width="110" height="5" fill="#334155" rx="1"/>
  <rect x="25" y="115" width="110" height="5" fill="#334155" rx="1"/>
  <rect x="25" y="165" width="110" height="5" fill="#334155" rx="1"/>
  <rect x="25" y="215" width="110" height="5" fill="#334155" rx="1"/>

  <!-- Books left shelf row 1 -->
  <rect x="28" y="40" width="12" height="24" fill="#EF4444" rx="1"/>
  <rect x="42" y="43" width="10" height="21" fill="#F59E0B" rx="1"/>
  <rect x="54" y="41" width="14" height="23" fill="#3B82F6" rx="1"/>
  <rect x="70" y="44" width="10" height="20" fill="#10B981" rx="1"/>
  <rect x="82" y="40" width="12" height="24" fill="#8B5CF6" rx="1"/>
  <rect x="96" y="42" width="10" height="22" fill="#F97316" rx="1"/>
  <rect x="108" y="41" width="14" height="23" fill="#06B6D4" rx="1"/>
  <!-- Books row 2 -->
  <rect x="28" y="90" width="14" height="24" fill="#6366F1" rx="1"/>
