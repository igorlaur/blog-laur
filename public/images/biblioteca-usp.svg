  <!-- Laptop hinges -->
  <rect x="290" y="237" width="20" height="3" fill="#64748B" rx="1"/>

  <!-- Desk lamp -->
  <rect x="385" y="185" width="5" height="50" fill="#94A3B8" rx="2"/>
  <rect x="380" y="165" width="5" height="22" fill="#94A3B8" rx="2" transform="rotate(-40 382 186)"/>
  <ellipse cx="367" cy="158" rx="18" ry="8" fill="url(#lampGrad)" opacity="0.9"/>
  <!-- Lamp light glow -->
  <ellipse cx="367" cy="165" rx="30" ry="20" fill="#FEF08A" opacity="0.12"/>

  <!-- Open book on desk -->
  <g filter="url(#bookShadow)">
    <path d="M170,200 Q215,192 235,195 L235,240 Q215,237 170,245 Z" fill="#F8FAFC" rx="2"/>
    <path d="M235,195 Q255,192 300,200 L300,245 Q255,237 235,240 Z" fill="#F1F5F9"/>
    <!-- Book lines -->
    <line x1="175" y1="203" x2="232" y2="198" stroke="#CBD5E1" stroke-width="1" opacity="0.8"/>
    <line x1="175" y1="210" x2="232" y2="205" stroke="#CBD5E1" stroke-width="1" opacity="0.8"/>
    <line x1="176" y1="217" x2="232" y2="212" stroke="#CBD5E1" stroke-width="1" opacity="0.8"/>
    <line x1="176" y1="224" x2="232" y2="219" stroke="#CBD5E1" stroke-width="1" opacity="0.8"/>
    <line x1="240" y1="198" x2="297" y2="202" stroke="#CBD5E1" stroke-width="1" opacity="0.8"/>
    <line x1="240" y1="205" x2="297" y2="209" stroke="#CBD5E1" stroke-width="1" opacity="0.8"/>
    <line x1="240" y1="212" x2="297" y2="216" stroke="#CBD5E1" stroke-width="1" opacity="0.8"/>
    <line x1="240" y1="219" x2="297" y2="223" stroke="#CBD5E1" stroke-width="1" opacity="0.8"/>
    <!-- Book spine -->
    <rect x="233" y="194" width="3" height="47" fill="#94A3B8" rx="1"/>
  </g>

  <!-- Coffee mug -->
  <rect x="315" y="215" width="28" height="28" fill="#374151" rx="4"/>
  <path d="M343,222 Q355,222 355,232 Q355,238 343,238" fill="none" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <!-- Steam -->
  <path d="M322,213 Q324,207 322,202" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M329,213 Q331,206 329,200" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M336,213 Q338,207 336,202" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Student silhouette -->
  <circle cx="300" cy="147" r="18" fill="#475569"/>
  <rect x="284" y="163" width="32" height="35" fill="#475569" rx="4"/>

  <!-- Title overlay -->
  <rect x="0" y="0" width="600" height="50" fill="rgba(0,0,0,0.55)"/>
  <text x="300" y="22" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="white" text-anchor="middle">Melhores Lugares para Estudar no Butantã</text>
  <text x="300" y="42" font-family="Arial, sans-serif" font-size="12" fill="#BFDBFE" text-anchor="middle">Bibliotecas • Cafés • Espaços Coworking • Dicas de Concentração</text>
</svg>
