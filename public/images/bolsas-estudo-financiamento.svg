<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3730A3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#F8FAFC;stop-opacity:0.90" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="300" fill="url(#backgroundGrad)"/>
  
  <!-- Floating geometric shapes -->
  <circle cx="100" cy="60" r="20" fill="#F59E0B" opacity="0.2"/>
  <circle cx="500" cy="80" r="30" fill="#10B981" opacity="0.15"/>
  <rect x="50" y="200" width="40" height="40" fill="#EC4899" opacity="0.1" rx="8" transform="rotate(45 70 220)"/>
  <circle cx="550" cy="220" r="15" fill="#8B5CF6" opacity="0.2"/>
  
  <!-- Main content area -->
  <rect x="80" y="60" width="440" height="180" fill="url(#cardGrad)" rx="16" filter="url(#shadow)"/>
  
  <!-- Title -->
  <text x="300" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#1F2937">Bolsas de Estudo</text>
  <text x="300" y="110" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#6B7280">Financiamento Estudantil 2025</text>
  
  <!-- Coins floating -->
  <g filter="url(#glow)">
    <circle cx="150" cy="140" r="20" fill="url(#coinGrad)"/>
    <text x="150" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#92400E">$</text>
    
    <circle cx="200" cy="120" r="18" fill="url(#coinGrad)"/>
    <text x="200" y="127" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#92400E">$</text>
    
    <circle cx="400" cy="135" r="22" fill="url(#coinGrad)"/>
    <text x="400" y="143" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#92400E">$</text>
    
    <circle cx="450" cy="115" r="16" fill="url(#coinGrad)"/>
    <text x="450" y="122" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#92400E">$</text>
  </g>
  
  <!-- Graduation cap in center -->
  <g transform="translate(300, 160)">
    <circle cx="0" cy="0" r="25" fill="#4F46E5"/>
    <path d="M-18 -8 L0 -18 L18 -8 L0 2 Z" fill="#FFFFFF"/>
    <rect x="15" y="-8" width="2" height="20" fill="#FFFFFF"/>
    <circle cx="18" cy="12" r="4" fill="#F59E0B"/>
  </g>
  
  <!-- Program badges -->
  <g transform="translate(120, 190)">
    <rect x="0" y="0" width="80" height="30" fill="#1E40AF" rx="6"/>
    <text x="40" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="white">FIES</text>
  </g>
  
  <g transform="translate(220, 190)">
    <rect x="0" y="0" width="80" height="30" fill="#059669" rx="6"/>
    <text x="40" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="white">ProUni</text>
  </g>
  
  <g transform="translate(320, 190)">
    <rect x="0" y="0" width="80" height="30" fill="#DC2626" rx="6"/>
    <text x="40" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="white">Privado</text>
  </g>
  
  <g transform="translate(420, 190)">
    <rect x="0" y="0" width="80" height="30" fill="#7C2D12" rx="6"/>
    <text x="40" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="white">Auxílio</text>
  </g>
  
  <!-- Percentage indicators -->
  <g transform="translate(100, 30)">
    <circle cx="0" cy="0" r="15" fill="#10B981" opacity="0.9"/>
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="white">100%</text>
  </g>
  
  <g transform="translate(500, 40)">
    <circle cx="0" cy="0" r="15" fill="#F59E0B" opacity="0.9"/>
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="white">50%</text>
  </g>
  
  <!-- Connecting lines -->
  <path d="M180 140 Q240 150 280 160" stroke="#3B82F6" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M420 135 Q380 145 320 160" stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Bottom decoration -->
  <path d="M0 260 Q150 250 300 260 Q450 270 600 260 L600 300 L0 300 Z" fill="rgba(255,255,255,0.1)"/>
</svg>