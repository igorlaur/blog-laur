<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#F8FAFC;stop-opacity:0.90" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="300" fill="url(#headerGrad)"/>
  
  <!-- Floating shapes -->
  <circle cx="80" cy="60" r="20" fill="rgba(255,255,255,0.1)"/>
  <circle cx="520" cy="80" r="30" fill="rgba(255,255,255,0.08)"/>
  <rect x="50" y="220" width="40" height="40" fill="rgba(255,255,255,0.06)" rx="8" transform="rotate(45 70 240)"/>
  
  <!-- Main content card -->
  <rect x="60" y="80" width="480" height="140" fill="url(#cardGrad)" rx="16" filter="url(#shadow)"/>
  
  <!-- Exam papers -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="80" height="100" fill="#FFFFFF" rx="4" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="10" y="15" width="60" height="3" fill="#3B82F6"/>
    <rect x="10" y="25" width="50" height="2" fill="#6B7280"/>
    <rect x="10" y="32" width="55" height="2" fill="#6B7280"/>
    <rect x="10" y="39" width="45" height="2" fill="#6B7280"/>
    <circle cx="20" cy="55" r="3" fill="#10B981"/>
    <circle cx="30" cy="55" r="3" fill="#10B981"/>
    <circle cx="40" cy="55" r="3" fill="#EF4444"/>
    <circle cx="50" cy="55" r="3" fill="#10B981"/>
    <circle cx="60" cy="55" r="3" fill="#10B981"/>
    <text x="40" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#059669">ENEM</text>
  </g>
  
  <!-- Calculator -->
  <g transform="translate(220, 110)">
    <rect x="0" y="0" width="60" height="80" fill="#1F2937" rx="6"/>
    <rect x="8" y="8" width="44" height="20" fill="#059669"/>
    <text x="30" y="21" text-anchor="middle" font-family="monospace" font-size="10" fill="white">98.5</text>
    <rect x="8" y="35" width="12" height="12" fill="#4B5563" rx="2"/>
    <rect x="24" y="35" width="12" height="12" fill="#4B5563" rx="2"/>
    <rect x="40" y="35" width="12" height="12" fill="#4B5563" rx="2"/>
    <rect x="8" y="50" width="12" height="12" fill="#4B5563" rx="2"/>
    <rect x="24" y="50" width="12" height="12" fill="#4B5563" rx="2"/>
    <rect x="40" y="50" width="12" height="12" fill="#4B5563" rx="2"/>
    <rect x="8" y="65" width="28" height="12" fill="#DC2626" rx="2"/>
    <rect x="40" y="65" width="12" height="12" fill="#059669" rx="2"/>
  </g>
  
  <!-- Books stack -->
  <g transform="translate(320, 120)">
    <rect x="0" y="30" width="50" height="8" fill="#EF4444" rx="2"/>
    <rect x="2" y="22" width="46" height="8" fill="#F59E0B" rx="2"/>
    <rect x="4" y="14" width="42" height="8" fill="#10B981" rx="2"/>
    <rect x="6" y="6" width="38" height="8" fill="#3B82F6" rx="2"/>
    <rect x="8" y="-2" width="34" height="8" fill="#8B5CF6" rx="2"/>
  </g>
  
  <!-- Calendar -->
  <g transform="translate(420, 110)">
    <rect x="0" y="0" width="60" height="70" fill="#FFFFFF" rx="4" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="0" y="0" width="60" height="15" fill="#DC2626" rx="4"/>
    <text x="30" y="11" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="white">2025</text>
    <circle cx="15" cy="25" r="2" fill="#6B7280"/>
    <circle cx="25" cy="25" r="2" fill="#6B7280"/>
    <circle cx="35" cy="25" r="2" fill="#6B7280"/>
    <circle cx="45" cy="25" r="2" fill="#6B7280"/>
    <circle cx="15" cy="35" r="2" fill="#6B7280"/>
    <circle cx="25" cy="35" r="2" fill="#DC2626"/>
    <circle cx="35" cy="35" r="2" fill="#6B7280"/>
    <circle cx="45" cy="35" r="2" fill="#6B7280"/>
    <circle cx="15" cy="45" r="2" fill="#6B7280"/>
    <circle cx="25" cy="45" r="2" fill="#6B7280"/>
    <circle cx="35" cy="45" r="2" fill="#10B981"/>
    <circle cx="45" cy="45" r="2" fill="#6B7280"/>
  </g>
  
  <!-- Main title -->
  <text x="300" y="50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="white">Vestibular & ENEM</text>
  <text x="300" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="rgba(255,255,255,0.9)">Guia Completo 2025</text>
  
  <!-- Bottom wave -->
  <path d="M0 250 Q150 240 300 250 Q450 260 600 250 L600 300 L0 300 Z" fill="rgba(255,255,255,0.1)"/>
</svg>